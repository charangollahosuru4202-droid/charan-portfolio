<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#b58254" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Subtle Architectural Grid Pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="800" x2="800" y2="800" />
    <line x1="200" y1="0" x2="200" y2="1000" />
    <line x1="400" y1="0" x2="400" y2="1000" />
    <line x1="600" y1="0" x2="600" y2="1000" />
  </g>

  <!-- Ambient Glow Behind Head -->
  <circle cx="400" cy="420" r="280" fill="url(#accentGlow)" filter="blur(40px)" />

  <!-- Avatar / Portrait Illustration -->
  <g filter="url(#shadow)">
    <!-- Shoulders & Hoodie -->
    <path d="M 170 1000 C 180 780, 240 680, 310 650 L 490 650 C 560 680, 620 780, 630 1000 Z" fill="url(#hoodieGrad)" />
    <!-- Hoodie collar/drawstrings -->
    <path d="M 340 650 Q 400 740 460 650 Z" fill="#1e40af" />
    <circle cx="370" cy="730" r="4" fill="#93c5fd" />
    <circle cx="430" cy="730" r="4" fill="#93c5fd" />
    <line x1="370" y1="680" x2="370" y2="730" stroke="#93c5fd" stroke-width="2" />
    <line x1="430" y1="680" x2="430" y2="730" stroke="#93c5fd" stroke-width="2" />

    <!-- Neck -->
    <path d="M 350 560 L 350 670 Q 400 690 450 670 L 450 560 Z" fill="#b58254" />
    <!-- Neck shadow -->
    <path d="M 350 560 Q 400 600 450 560 Z" fill="#9a6b42" opacity="0.6" />

    <!-- Head / Face -->
    <rect x="300" y="300" width="200" height="260" rx="90" fill="url(#skinGrad)" />

    <!-- Ears -->
    <ellipse cx="295" cy="430" rx="18" ry="28" fill="#c49363" />
    <ellipse cx="505" cy="430" rx="18" ry="28" fill="#c49363" />

    <!-- Hair -->
    <path d="M 285 360 C 285 240, 515 240, 515 360 C 515 380, 500 410, 485 360 C 440 330, 360 330, 315 360 C 300 410, 285 380, 285 360 Z" fill="url(#hairGrad)" />
    <!-- Hair Volume Texture -->
    <path d="M 310 280 Q 400 230 490 280 C 510 320, 500 350, 485 340 C 440 310, 360 310, 315 340 Z" fill="#27272a" opacity="0.5" />

    <!-- Eyebrows -->
    <rect x="330" y="380" width="50" height="8" rx="4" fill="#18181b" transform="rotate(3 355 384)" />
    <rect x="420" y="380" width="50" height="8" rx="4" fill="#18181b" transform="rotate(-3 445 384)" />

    <!-- Eyes -->
    <ellipse cx="355" cy="415" rx="11" ry="8" fill="#18181b" />
    <ellipse cx="445" cy="415" rx="11" ry="8" fill="#18181b" />
    <circle cx="358" cy="412" r="3" fill="#ffffff" />
    <circle cx="448" cy="412" r="3" fill="#ffffff" />

    <!-- Glasses Frame (Minimal Modern Designer Frame) -->
    <rect x="330" y="398" width="55" height="36" rx="8" fill="none" stroke="#0f172a" stroke-width="4" />
    <rect x="415" y="398" width="55" height="36" rx="8" fill="none" stroke="#0f172a" stroke-width="4" />
    <line x1="385" y1="412" x2="415" y2="412" stroke="#0f172a" stroke-width="4" />
    <line x1="300" y1="412" x2="330" y2="412" stroke="#0f172a" stroke-width="3" />
    <line x1="470" y1="412" x2="500" y2="412" stroke="#0f172a" stroke-width="3" />

    <!-- Nose -->
    <path d="M 398 425 Q 402 460 395 465 Q 404 466 410 460" stroke="#9a6b42" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Friendly Smile -->
    <path d="M 370 495 Q 400 520 430 495" stroke="#78350f" stroke-width="3.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Clean Bottom Identity Strip -->
  <g transform="translate(0, 880)">
    <rect x="180" y="0" width="440" height="70" rx="35" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
    <text x="400" y="32" fill="#f8fafc" font-family="'Outfit', -apple-system, sans-serif" font-weight="600" font-size="19" text-anchor="middle">
      Golla Hosuru Charan
    </text>
    <text x="400" y="54" fill="#94a3b8" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="400" font-size="13" text-anchor="middle">
      B.Tech Student · NIAT, Tamil Nadu
    </text>
  </g>
</svg>
