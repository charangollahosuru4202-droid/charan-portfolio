<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#pGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Browser/Window Mockup Frame -->
  <g transform="translate(60, 50)">
    <rect width="680" height="400" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="1.5" />
    <!-- Header -->
    <rect width="680" height="38" rx="12" fill="#1e293b" />
    <rect y="26" width="680" height="12" fill="#1e293b" />
    <circle cx="24" cy="19" r="5" fill="#ef4444" />
    <circle cx="42" cy="19" r="5" fill="#f59e0b" />
    <circle cx="60" cy="19" r="5" fill="#10b981" />
    <rect x="180" y="9" width="320" height="20" rx="6" fill="#0f172a" />
    <text x="340" y="23" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">charan-project.web.app</text>

    <!-- Content Area Mockup -->
    <rect x="40" y="70" width="260" height="24" rx="4" fill="url(#accentLine)" opacity="0.9" />
    <rect x="40" y="105" width="400" height="12" rx="3" fill="#334155" />
    <rect x="40" y="125" width="340" height="12" rx="3" fill="#334155" opacity="0.6" />

    <!-- Bento Cards in Mockup -->
    <rect x="40" y="160" width="180" height="180" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="60" y="180" width="40" height="40" rx="8" fill="#3b82f6" opacity="0.3" />
    <rect x="60" y="240" width="120" height="12" rx="3" fill="#94a3b8" />
    <rect x="60" y="260" width="90" height="10" rx="3" fill="#64748b" />

    <rect x="240" y="160" width="180" height="180" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="260" y="180" width="40" height="40" rx="8" fill="#10b981" opacity="0.3" />
    <rect x="260" y="240" width="120" height="12" rx="3" fill="#94a3b8" />
    <rect x="260" y="260" width="90" height="10" rx="3" fill="#64748b" />

    <rect x="440" y="160" width="200" height="180" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="460" y="180" width="40" height="40" rx="8" fill="#8b5cf6" opacity="0.3" />
    <rect x="460" y="240" width="140" height="12" rx="3" fill="#94a3b8" />
    <rect x="460" y="260" width="100" height="10" rx="3" fill="#64748b" />
  </g>
</svg>
